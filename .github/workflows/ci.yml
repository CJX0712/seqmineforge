name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref -- a 3-minute job does not need to
# finish after two newer commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ruff (pinned)
        run: python -m pip install --disable-pip-version-check "ruff==0.16.10"
      - name: ruff check (hard gate, no `|| true`)
        run: ruff check .
      - name: ruff format --check (hard gate)
        run: ruff format --check .

  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: pytest with coverage
        run: >
          python -m pytest -q
          -W ignore::UserWarning
          --cov=seqmineforge
          --cov-report=term
          --cov-report=xml
        env:
          # Force the offline path so a missing Tier-0 backend cannot silently
          # turn the suite green on a weaker code path.
          PYTHONIOENCODING: utf-8

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  demo:
    name: demo smoke (acceptance gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run demo and require all gates to pass
        # The demo exits non-zero when any acceptance gate fails, so this step
        # is a hard gate rather than a smoke test that always passes.
        run: python examples/run_demo.py --out benchmark.json

      - name: Determinism re-run must be byte-identical
        run: |
          python examples/run_demo.py --out benchmark-rerun.json --quiet
          python - <<'PY'
          import json, pathlib, sys
          a = json.loads(pathlib.Path("benchmark.json").read_text(encoding="utf-8"))
          b = json.loads(pathlib.Path("benchmark-rerun.json").read_text(encoding="utf-8"))
          keys = ("datasets", "efficiency", "verification", "utility", "gates")
          bad = []
          for k in keys:
              if json.dumps(a[k], sort_keys=True) != json.dumps(b[k], sort_keys=True):
                  bad.append(k)
          # `elapsed_sec` is wall-clock and is deliberately excluded above.
          if bad:
              print(f"NON-DETERMINISTIC sections: {bad}", file=sys.stderr)
              sys.exit(1)
          print("determinism OK: datasets / efficiency / verification / utility / gates identical")
          PY

      - name: CLI smoke
        run: |
          python -m seqmineforge.cli info
          python -m seqmineforge.cli mine --dataset grouped --top 5
          python -m seqmineforge.cli verify --dataset grouped --max-length 3

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No credentials in tracked files
        run: |
          if git grep -nE "(sk-[A-Za-z0-9]{16,}|api[_-]?key[[:space:]]*[=:]|token[[:space:]]*[=:][[:space:]]*['\"][A-Za-z0-9]{16,}|password[[:space:]]*[=:])" -- '*.py' '*.md' '*.toml' '*.yml'; then
            echo "::error::potential secret found in tracked files"
            exit 1
          fi
          echo "secret scan clean"