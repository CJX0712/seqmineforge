[project]
name = "seqmineforge"
version = "0.1.0"
description = "Verified deterministic sequential pattern mining (author: 晨星)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
keywords = [
    "sequential-pattern-mining",
    "prefixspan",
    "spam",
    "spade",
    "data-mining",
    "deterministic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
seqmineforge = "seqmineforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seqmineforge*"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
# `pythonpath = ["."]` is required: without it CI cannot import the package
# from the repository root and every test errors with ModuleNotFoundError.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["seqmineforge"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned, non-trivial rule set.  Every rule enabled here has actually fired on
# this codebase during development, so none of them is decorative.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "PL",   # pylint subset
]
ignore = [
    "E501",    # line length handled by the formatter
    "PLR0912", # branching is intentional in the miner DFS
    "PLR0913", # the miner signatures are the documented protocol
    "PLR0915", # ditto
    "PLR0917", # `mine()` has 5 params by contract; see core/interfaces.Miner
    "PLR2004", # magic values are clearer inline for algorithm constants
    "B008",
    # `str, Enum` is a *public API* choice: `PatternType.SUBSEQUENCE` and
    # `"subsequence"` must compare equal so config/CLI strings round-trip
    # without a translation table.  UP042 wants StrEnum, which changes the
    # repr and is a breaking change for a 0.x package.
    "UP042",
    # `x` reads better than the multiplication sign in the docstring prose.
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
# Function-local imports are intentional throughout: they break import cycles
# (`features` -> `miners.matching` -> ...), keep heavy module load inside the
# function that needs it, and keep the tests independent of each other.
"seqmineforge/cli.py" = ["PLC0415"]
"seqmineforge/data/dgp.py" = ["PLC0415"]
"seqmineforge/eval/*.py" = ["PLC0415"]
"seqmineforge/pipeline/*.py" = ["PLC0415"]
"seqmineforge/miners/*.py" = ["PLC0415"]
"tests/*" = ["PLR2004", "SIM117", "PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"